name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/build-android.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare web assets
        run: mkdir -p www && cp index.html www/index.html
      - name: Install dependencies
        run: npm install
      - name: Add Android platform
        run: npx cap add android
      - name: Install Android Keystore-backed secure storage plugin
        run: |
          set -euo pipefail
          mkdir -p android/app/src/main/java/com/khedma/app
          cat > android/app/src/main/java/com/khedma/app/KhedmaSecureStoragePlugin.java <<'JAVA'
          package com.khedma.app;

          import android.content.SharedPreferences;
          import android.security.keystore.KeyGenParameterSpec;
          import android.security.keystore.KeyProperties;
          import android.util.Base64;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import java.nio.ByteBuffer;
          import java.security.KeyStore;
          import org.json.JSONObject;
          import javax.crypto.Cipher;
          import javax.crypto.KeyGenerator;
          import javax.crypto.SecretKey;
          import javax.crypto.spec.GCMParameterSpec;

          @CapacitorPlugin(name = "KhedmaSecureStorage")
          public class KhedmaSecureStoragePlugin extends Plugin {
              private static final String ALIAS = "KhedmaOwnerDeviceKey";
              private static final String PREFS = "khedma_secure_store";
              private SecretKey secretKey() throws Exception {
                  KeyStore ks = KeyStore.getInstance("AndroidKeyStore");
                  ks.load(null);
                  java.security.Key key = ks.getKey(ALIAS, null);
                  if (key instanceof SecretKey) return (SecretKey) key;
                  KeyGenerator gen = KeyGenerator.getInstance(KeyProperties.KEY_ALGORITHM_AES, "AndroidKeyStore");
                  gen.init(new KeyGenParameterSpec.Builder(ALIAS,
                      KeyProperties.PURPOSE_ENCRYPT | KeyProperties.PURPOSE_DECRYPT)
                      .setBlockModes(KeyProperties.BLOCK_MODE_GCM)
                      .setEncryptionPaddings(KeyProperties.ENCRYPTION_PADDING_NONE)
                      .setRandomizedEncryptionRequired(true)
                      .build());
                  return gen.generateKey();
              }
              @PluginMethod
              public void set(PluginCall call) {
                  try {
                      String key = call.getString("key");
                      String value = call.getString("value");
                      if (key == null || value == null) { call.reject("Missing key or value"); return; }
                      Cipher cipher = Cipher.getInstance("AES/GCM/NoPadding");
                      cipher.init(Cipher.ENCRYPT_MODE, secretKey());
                      byte[] encrypted = cipher.doFinal(value.getBytes(java.nio.charset.StandardCharsets.UTF_8));
                      byte[] iv = cipher.getIV();
                      ByteBuffer buffer = ByteBuffer.allocate(4 + iv.length + encrypted.length);
                      buffer.putInt(iv.length).put(iv).put(encrypted);
                      String encoded = Base64.encodeToString(buffer.array(), Base64.NO_WRAP);
                      getContext().getSharedPreferences(PREFS, 0).edit().putString(key, encoded).apply();
                      call.resolve();
                  } catch (Exception e) { call.reject("Secure storage write failed", e); }
              }
              @PluginMethod
              public void get(PluginCall call) {
                  try {
                      String key = call.getString("key");
                      String encoded = getContext().getSharedPreferences(PREFS, 0).getString(key, null);
                      JSObject result = new JSObject();
                      if (encoded == null) { result.put("value", JSONObject.NULL); call.resolve(result); return; }
                      ByteBuffer buffer = ByteBuffer.wrap(Base64.decode(encoded, Base64.NO_WRAP));
                      int ivLength = buffer.getInt();
                      byte[] iv = new byte[ivLength]; buffer.get(iv);
                      byte[] encrypted = new byte[buffer.remaining()]; buffer.get(encrypted);
                      Cipher cipher = Cipher.getInstance("AES/GCM/NoPadding");
                      cipher.init(Cipher.DECRYPT_MODE, secretKey(), new GCMParameterSpec(128, iv));
                      result.put("value", new String(cipher.doFinal(encrypted), java.nio.charset.StandardCharsets.UTF_8));
                      call.resolve(result);
                  } catch (Exception e) { call.reject("Secure storage read failed", e); }
              }
              @PluginMethod
              public void remove(PluginCall call) {
                  String key = call.getString("key");
                  if (key != null) getContext().getSharedPreferences(PREFS, 0).edit().remove(key).apply();
                  call.resolve();
              }
          }
          JAVA
          cat > android/app/src/main/java/com/khedma/app/MainActivity.java <<'JAVA'
          package com.khedma.app;
          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;
          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(KhedmaSecureStoragePlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          JAVA
      - name: Install Khedma launcher icon
        run: |
          mkdir -p android/app/src/main/res/drawable android/app/src/main/res/mipmap-anydpi-v26
          cat > android/app/src/main/res/drawable/ic_khedma_foreground.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#FFFFFFFF" android:pathData="M54,13 C37,13 24,26 24,43 C24,63 54,94 54,94 C54,94 84,63 84,43 C84,26 71,13 54,13 Z"/>
              <path android:fillColor="#FF0755C9" android:pathData="M54,25 C44,25 36,33 36,43 C36,53 44,61 54,61 C64,61 72,53 72,43 C72,33 64,25 54,25 Z"/>
              <path android:fillColor="#FFFFFFFF" android:pathData="M49,34 L59,34 L59,39 L54,39 L54,44 L60,44 L60,49 L54,49 L54,55 L49,55 Z"/>
          </vector>
          EOF
          cat > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@drawable/ic_khedma_foreground"/>
          </adaptive-icon>
          EOF
          mkdir -p android/app/src/main/res/values
          cat > android/app/src/main/res/values/ic_launcher_background.xml <<'EOF'
          <resources><color name="ic_launcher_background">#0755C9</color></resources>
          EOF
      - name: Configure Android OAuth deep link
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          i=s.find('<activity')
          if i<0:
              raise SystemExit('No activity element found in generated Android manifest')
          end=s.find('>', i)
          if end<0:
              raise SystemExit('Malformed activity element in generated Android manifest')
          block='''\n            <intent-filter>\n                <action android:name="android.intent.action.VIEW" />\n                <category android:name="android.intent.category.DEFAULT" />\n                <category android:name="android.intent.category.BROWSABLE" />\n                <data android:scheme="com.khedma.app" android:host="login-callback" />\n            </intent-filter>'''
          if 'android:scheme="com.khedma.app"' not in s:
              s=s[:end+1]+block+s[end+1:]
          p.write_text(s)
          PY
      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo "Missing ANDROID_KEYSTORE_BASE64 secret" && exit 1)
          test -n "$ANDROID_KEYSTORE_PASSWORD" || (echo "Missing ANDROID_KEYSTORE_PASSWORD secret" && exit 1)
          test -n "$ANDROID_KEY_PASSWORD" || (echo "Missing ANDROID_KEY_PASSWORD secret" && exit 1)
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/khedma-release.keystore
          if [ -z "$ANDROID_KEY_ALIAS" ]; then
            KEYSTORE_INFO="$(keytool -list -keystore android/app/khedma-release.keystore -storepass "$ANDROID_KEYSTORE_PASSWORD")" || {
              echo "Could not open the Android keystore. Check ANDROID_KEYSTORE_PASSWORD."
              exit 1
            }
            mapfile -t KEY_ALIASES < <(printf '%s\n' "$KEYSTORE_INFO" | awk -F, '/,/{print $1}')
            if [ "${#KEY_ALIASES[@]}" -ne 1 ] || [ -z "${KEY_ALIASES[0]}" ]; then
              echo "Keystore alias is ambiguous. Add the exact ANDROID_KEY_ALIAS secret in GitHub Actions."
              exit 1
            fi
            export ANDROID_KEY_ALIAS="${KEY_ALIASES[0]}"
            echo "Detected the single key alias in the keystore."
          fi
          echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          KEY_ENTRY="$(keytool -list -v -alias "$ANDROID_KEY_ALIAS" -keystore android/app/khedma-release.keystore -storepass "$ANDROID_KEYSTORE_PASSWORD")"
          printf '%s\n' "$KEY_ENTRY" | grep -q "PrivateKeyEntry" || {
            echo "The configured alias is not a private-key entry."
            exit 1
          }
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          p=Path('android/app/build.gradle')
          s=p.read_text()
          if 'signingConfigs' not in s:
              s=s.replace('android {', """android {
              signingConfigs {
                  release {
                      storeFile file('khedma-release.keystore')
                      storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                      keyAlias System.getenv('ANDROID_KEY_ALIAS')
                      keyPassword System.getenv('ANDROID_KEY_PASSWORD')
                  }
              }""", 1)
          build_number=int(os.environ['GITHUB_RUN_NUMBER'])
          s,n=re.subn(r'versionCode\s+\d+', f'versionCode {build_number}', s, count=1)
          if n != 1:
              raise SystemExit('Could not set a unique increasing Android versionCode')
          if 'signingConfig signingConfigs.release' not in s:
              s=s.replace('buildTypes {', """buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }""", 1)
          p.write_text(s)
          PY
      - name: Sync app
        run: npx cap sync android
      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_PASSWORD" || (echo "Missing ANDROID_KEYSTORE_PASSWORD in build step" && exit 1)
          test -n "$ANDROID_KEY_PASSWORD" || (echo "Missing ANDROID_KEY_PASSWORD in build step" && exit 1)
          test -n "$ANDROID_KEY_ALIAS" || (echo "Resolved ANDROID_KEY_ALIAS was not passed to build step" && exit 1)
          cd android && chmod +x gradlew && ./gradlew assembleRelease
      - name: Verify APK signature
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK" || (echo "Release APK was not created" && exit 1)
          APKSIGNER="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -type f -name apksigner 2>/dev/null | sort -V | tail -n 1)"
          test -x "$APKSIGNER" || (echo "Android SDK apksigner tool was not found" && exit 1)
          "$APKSIGNER" verify --verbose "$APK"
          "$APKSIGNER" verify --print-certs "$APK"
      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: khedma-android-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish public APK download
        run: |
          set -euo pipefail
          mkdir -p public-download
          cp android/app/build/outputs/apk/release/app-release.apk public-download/khedma.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p downloads
          cp public-download/khedma.apk downloads/khedma.apk
          git add downloads/khedma.apk
          if git diff --cached --quiet; then
            echo "Public APK is already current."
          else
            git commit -m "Publish latest signed Khedma Android APK"
            git push origin HEAD:main
          fi
